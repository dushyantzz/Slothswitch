# SlothSwitch Routing Configuration
# This file defines the routing behavior, available paths, and policy constraints.

routing:
  # The target workload domain for the MVP
  domain: "customer_support"

  # Available route categories and their properties
  routes:
    FAST_PATH:
      description: "Deterministic function or structured decision; no generative LLM needed"
      cost_tier: 0
      enabled: true
    SMALL_LLM:
      description: "Bounded generation or processing handled by a smaller model"
      cost_tier: 1
      enabled: true
    LARGE_LLM:
      description: "Tasks requiring capabilities only available in a stronger model"
      cost_tier: 2
      enabled: true
    CLARIFY:
      description: "Missing information prevents a reliable route or completion"
      cost_tier: 0
      enabled: true
    FALLBACK:
      description: "Route decision is invalid, unsupported, or fails validation"
      cost_tier: 2
      enabled: true
    HUMAN_REVIEW:
      description: "Request is outside validated scope or requires human judgment"
      cost_tier: 0
      enabled: true

  # Decision model configuration
  decision_model:
    adapter: "laya"  # or "mock" for testing without Laya installed
    checkpoint: "convaiinnovations/laya"
    # Confidence thresholds — must be validated on held-out data before use
    acceptance_threshold: 0.7  # placeholder; not yet validated
    fallback_on_low_confidence: true

  # Task model adapters
  task_models:
    small_llm:
      adapter: "mock"  # "openai", "huggingface", etc.
      model: "mock-small"
    large_llm:
      adapter: "mock"
      model: "mock-large"

  # Policy constraints
  policy:
    max_request_length: 10000  # characters
    supported_content_types: ["text/plain"]
    max_retries: 2
    timeout_seconds: 30
    # Categories that must always go to LARGE_LLM or HUMAN_REVIEW
    high_risk_categories: ["security", "legal", "financial"]
    # Enable deterministic cache (opt-in)
    cache_enabled: false

  # Baseline configuration (for evaluation comparison)
  baseline:
    # All requests go to this model in baseline mode
    model: "large_llm"
    adapter: "mock"

# Telemetry settings
telemetry:
  enabled: true
  log_raw_prompts: false  # Privacy: do not log raw user text by default
  metrics_output: "logs/metrics.jsonl"

# Evaluation settings
evaluation:
  dataset_path: "datasets/customer_support_routing.json"
  test_split_ratio: 0.2
  random_seed: 42
